version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto11
    commands:
      - echo "Installing dependencies..."
      - echo "Java version:"
      - java -version
      - echo "Maven version:"
      - mvn -version

  pre_build:
    commands:
      - echo "Pre-build phase started on $(date)"
      - echo "Workspace directory:"
      - pwd
      - ls -la

  build:
    commands:
      - echo "Build phase started on $(date)"
      - echo "Building Flink application with Maven..."
      - mvn clean package -DskipTests
      - echo "Build completed. Checking JAR file..."
      - ls -lh target/
      - |
        if [ ! -f "target/${APP_NAME}.jar" ]; then
          echo "ERROR: JAR file not found at target/${APP_NAME}.jar"
          exit 1
        fi
      - echo "JAR file found. Size: $(du -h target/${APP_NAME}.jar | cut -f1)"

  post_build:
    commands:
      - echo "Post-build phase started on $(date)"
      - echo "Uploading JAR to S3..."
      - aws s3 cp target/${APP_NAME}.jar s3://${STREAMING_APP_BUCKET}/${APP_NAME}.jar --region ${AWS_REGION}
      - echo "Getting S3 object version..."
      - |
        S3_VERSION=$(aws s3api head-object \
          --bucket ${STREAMING_APP_BUCKET} \
          --key ${APP_NAME}.jar \
          --region ${AWS_REGION} \
          --query 'VersionId' \
          --output text)
        echo "S3 Object Version: $S3_VERSION"
      - echo "JAR uploaded successfully"
      - echo "Build completed on $(date)"

artifacts:
  files:
    - target/${APP_NAME}.jar
  name: BuildArtifact

cache:
  paths:
    - '/root/.m2/**/*'
